server:
  port: 8080

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/carbonfootprint?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:this-is-a-256-bit-secret-key-for-jwt-signing-in-production}
  expiration: 86400000
