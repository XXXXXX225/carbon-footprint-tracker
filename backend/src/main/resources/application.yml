server:
  port: 8888
  servlet:
    context-path: ""

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/carbonfootprint?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0

  security:
    user:
      name: user
      password: password

# JWT配置
jwt:
  secret: your-secret-key-change-in-production
  expiration: 86400000  # 24小时

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config

ai:
  provider: ${AI_PROVIDER:zhipu}
  base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  # 原来的 key 继续留着，用来做纯文本处理
  api-key: ${AI_API_KEY:e228506735934d6f83299192705bd921.08VVDcY3ODpO3uwx}
  # 新增一个 vision key，用来做图片解析
  vision-api-key: ${AI_VISION_API_KEY:8622f339ebc54568a096820d43d12970.NIcVdGN7oCmnqfD2}
  # 也可以顺便把 vision 的模型名配置抽出来，更规范
  model: ${AI_MODEL:glm-4-flash}
  vision-model: ${AI_VISION_MODEL:glm-4v-flash}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
