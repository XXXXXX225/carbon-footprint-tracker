server:
  port: 8888
  servlet:
    context-path: ""

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/carbonfootprint?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0

  security:
    user:
      name: user
      password: password

# JWT配置
jwt:
  secret: your-secret-key-change-in-production
  expiration: 86400000  # 24小时

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config

ai:
  provider: ${AI_PROVIDER:local}
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:95b7418745ee47da966f17f9bf5a4d48.BI9EnuPdpt0khKtx}
  model: ${AI_MODEL:local-rule-engine}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
